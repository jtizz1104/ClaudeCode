# Corre las pruebas de Timbra PY (SIFEN y API) en cada cambio de timbra/.
name: Timbra PY · pruebas

on:
  push:
    paths: ["timbra/**", ".github/workflows/timbra-tests.yml"]
  pull_request:
    paths: ["timbra/**", ".github/workflows/timbra-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timbra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timbra/package-lock.json
      - run: npm ci
      - run: npm test
