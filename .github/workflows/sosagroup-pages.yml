# Publica la carpeta sosagroup/ en GitHub Pages para probar el sitio
# (https://jtizz1104.github.io/ClaudeCode/). Corre en cada cambio de main
# que toque sosagroup/, o a mano desde la pestaña Actions.
name: SosaGroup en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["sosagroup/**", ".github/workflows/sosagroup-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Se publica solo el sitio: quedan afuera las notas internas, las herramientas
      # de armado y el diccionario fuente (las páginas usan assets/i18n-en.js y -pt.js)
      - name: Preparar la carpeta publicada
        run: |
          cp -r sosagroup _site
          rm -rf _site/README.md _site/tools _site/assets/i18n-dict.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
