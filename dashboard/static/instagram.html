<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publicar prueba en Instagram</title>
  <link rel="stylesheet" href="/dashboard/style.css" />
  <style>
    .demo { max-width:760px; margin:48px auto; padding:28px; background:#11182d; border:1px solid #27304a; border-radius:16px; }
    .demo label { display:block; margin:18px 0 7px; }
    .demo input[type=file], .demo textarea { width:100%; box-sizing:border-box; padding:12px; background:#090f20; color:#fff; border:1px solid #38415e; border-radius:8px; }
    .demo textarea { min-height:120px; }
    .demo button { margin-top:22px; padding:12px 18px; border:0; border-radius:8px; background:#c13584; color:white; font-weight:700; cursor:pointer; }
    .demo button:disabled { opacity:.55; cursor:wait; }
    .notice { color:#b8c1df; line-height:1.5; }
    #result { margin-top:18px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <main class="demo">
    <p><a href="/dashboard/">← Volver al dashboard</a></p>
    <h1>Publicar Reel de prueba</h1>
    <p class="notice">La publicación será visible en @codigonegocioia. Revisá cuidadosamente el video y el texto antes de confirmar.</p>
    <form id="publish-form">
      <label for="video">Video MP4</label>
      <input id="video" name="video" type="file" accept="video/mp4,.mp4" required />
      <label for="caption">Descripción</label>
      <textarea id="caption" name="caption" maxlength="2200" required></textarea>
      <label><input id="confirm" type="checkbox" required /> Revisé la cuenta, el video y el texto; autorizo su publicación.</label>
      <button type="submit">Publicar Reel</button>
    </form>
    <div id="result" role="status"></div>
  </main>
  <script>
    const form = document.querySelector('#publish-form');
    const button = form.querySelector('button');
    const result = document.querySelector('#result');
    fetch('/api/instagram/status').then(async response => {
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'No se pudo verificar Instagram');
      result.textContent = `Cuenta conectada: @${data.username || 'codigonegocioia'}`;
    }).catch(error => { result.textContent = error.message; button.disabled = true; });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!confirm('¿Confirmás la publicación visible de este Reel en @codigonegocioia?')) return;
      button.disabled = true;
      result.textContent = 'Subiendo y procesando el Reel… puede tardar varios minutos.';
      try {
        const response = await fetch('/api/instagram/publish', { method:'POST', body:new FormData(form) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Instagram rechazó la publicación');
        result.textContent = `Reel publicado correctamente. ID: ${data.media_id}`;
      } catch (error) {
        result.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
