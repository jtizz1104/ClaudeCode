# Fuentes para el pipeline de noticias de IA (pipelines/ai_news).
# Los feeds RSS cambian de URL de tanto en tanto: si alguno deja de andar,
# buscá "<sitio> rss feed" y actualizá la url acá, no hace falta tocar código.

rss:
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
  - name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
  - name: Anthropic News
    url: https://www.anthropic.com/rss.xml
  - name: MIT Technology Review - AI
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
  - name: TechCrunch - AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
  - name: The Verge - AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
  - name: VentureBeat - AI
    url: https://venturebeat.com/category/ai/feed/

# Hacker News vía la API pública de Algolia (sin API key).
hacker_news:
  keywords: ["AI", "LLM", "GPT", "Claude", "Gemini", "machine learning", "OpenAI", "Anthropic", "modelo de lenguaje"]
  min_points: 50
  hours_lookback: 24

# Papers nuevos vía la API pública de arXiv (sin API key).
arxiv:
  categories: ["cs.AI", "cs.CL", "cs.LG"]
  max_results: 15
  hours_lookback: 24

# Cuántas noticias finales entran al resumen/short diario.
top_n_stories: 5
